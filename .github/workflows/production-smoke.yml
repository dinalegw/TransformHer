name: Production smoke

on:
  workflow_dispatch:
    inputs:
      allow_degraded:
        description: Allow degraded storage while diagnosing pre-release production
        required: false
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run production smoke checks
        run: |
          if [ "${{ inputs.allow_degraded }}" = "true" ]; then
            npm run smoke:prod -- --allow-degraded
          else
            npm run smoke:prod
          fi
